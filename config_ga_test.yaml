# ============================================================================
# CRYPTO TRADING GA - TEST CONFIGURATION (SMALL GA RUN)
# ============================================================================

# DATA CONFIGURATION (Binance)
data:
  exchange: "binance"
  symbol: "BTC/USDT"
  market_type: "future"
  timeframe: "15m"
  start: "2024-11-07 00:00:00"  # Solo 1 día para test
  end: "2024-11-08 00:00:00"

  pagination:
    max_candles_per_request: 1000
    rate_limit_delay_ms: 100
    max_retries: 3

  enforce_real_data: true

  time_map:
    "1m":  {minutes: 1,   bars_per_year: 525600}
    "5m":  {minutes: 5,   bars_per_year: 105120}
    "15m": {minutes: 15,  bars_per_year: 35040}
    "1h":  {minutes: 60,  bars_per_year: 8760}
    "4h":  {minutes: 240, bars_per_year: 2190}
    "1d":  {minutes: 1440, bars_per_year: 365}

# TRANSACTION COSTS (Binance Futures)
costs:
  fees_bps_long: 4.0
  fees_bps_short: 4.0
  slippage_bps_long: 2.0
  slippage_bps_short: 2.0

# WALK-FORWARD CONFIGURATION
walkforward:
  train_months: 6
  test_months: 2
  step_months: 1

# GENETIC ALGORITHM (REDUCED FOR TESTING)
ga:
  population: 10          # Pequeño para test rápido
  generations_max: 3      # Solo 3 generaciones
  patience_no_improve: 2
  elitism: 1
  mutation_rate: 0.15
  crossover_rate: 0.70
  window_min: 2
  window_max: 4           # Ventana más pequeña
  allow_indicators: false
  seed: 42

  fitness:
    weight_upi: 0.5
    weight_sharpe: 0.3
    weight_cagr: 0.2
    cagr_min_threshold: 0.15
    sharpe_cap: 3.0
    cagr_cap: 0.30

  fast_mode:
    enabled: true
    n_windows: 5
    strategy: "stratified"

  evolution_tracking:
    enabled: true
    sample_size_per_generation: 3    # Pequeño
    save_every_n_generations: 1      # Guardar cada gen
    output_dir: "./evolution_snapshots"

# EXIT RULES
exits:
  use_time_exit: false
  bars_hold: 96

  use_atr_exits: true
  atr_period: 14
  atr_stop: 1.5
  atr_take: 3.0

# SELECTION & FILTERING (EXTREMELY RELAXED FOR 1-DAY TEST)
selection:
  topk: 5                # Menos para test
  corr_threshold: 0.95   # Casi sin restricción para test

  filters:
    upi_min: -1.0        # Sin restricción práctica
    sharpe_min: -1.0     # Sin restricción práctica
    cagr_min: -1.0       # Sin restricción práctica
    max_drawdown_max: 1.0  # Sin restricción práctica
    profit_factor_min: 0.0  # Sin restricción práctica
    win_rate_min: 0.0    # Sin restricción práctica
    min_trades_per_window: 3  # Solo 3 trades mínimos

# ROBUSTNESS TESTS (REDUCED FOR FAST TEST)
robustness:
  seed: 42
  bootstrap:
    n_iterations: 50      # Muy reducido para test rápido
    block_size: 10        # Pequeño para dataset de 1 día
    confidence_level: 0.95
  hansen_spa:
    enabled: true         # Enabled para test completo
    alpha: 0.05
  white_rc:
    enabled: true         # Enabled para test completo
    alpha: 0.05

# OUTPUT
output:
  reports_dir: "./output_reports"
  logs_dir: "./logs"
  evolution_dir: "./evolution_snapshots"
  save_equity_curves: true
  save_correlation_matrix: true
  save_pattern_details: true
  verbose_logging: true

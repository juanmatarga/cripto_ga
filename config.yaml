# ============================================================================
# CRYPTO TRADING GA - CONFIGURATION
# ============================================================================

# DATA CONFIGURATION (Binance)
data:
  exchange: "binance"
  symbol: "BTC/USDT"      # Formato ccxt: BASE/QUOTE
  market_type: "future"   # "spot" o "future"
  timeframe: "15m"        # Ver TIME_MAP abajo
  start: "2023-01-01 00:00:00"
  end: "2025-10-25 23:59:59"

  # Paginación (Binance limit: 1000 candles/request)
  pagination:
    max_candles_per_request: 1000
    rate_limit_delay_ms: 100  # Delay entre requests (evitar rate limits)
    max_retries: 3

  # Validación
  enforce_real_data: true

  # TIME_MAP: Conversión timeframe -> minutos y barras/año
  # Para cambiar timeframe, solo modificar "timeframe" arriba
  time_map:
    "1m":  {minutes: 1,   bars_per_year: 525600}
    "5m":  {minutes: 5,   bars_per_year: 105120}
    "15m": {minutes: 15,  bars_per_year: 35040}
    "1h":  {minutes: 60,  bars_per_year: 8760}
    "4h":  {minutes: 240, bars_per_year: 2190}
    "1d":  {minutes: 1440, bars_per_year: 365}

# TRANSACTION COSTS (Binance Futures)
costs:
  # Binance Futures fees (USDT-M)
  fees_bps_long: 1.0    # 0.01% taker fee (market orders)
  fees_bps_short: 1.0   # 0.01% taker fee

  # Slippage (cripto es más líquido que acciones)
  slippage_bps_long: 1.0   # 0.01% (BTC muy líquido)
  slippage_bps_short: 1.0  # 0.01%

  # Funding rate (futuros perpetuos): IGNORAR en este proyecto
  # En producción real, considerar funding cada 8h (~0.01% promedio)

# WALK-FORWARD CONFIGURATION
walkforward:
  train_months: 6      # 6 meses train (cripto más volátil)
  test_months: 2       # 2 meses test
  step_months: 1       # Rolling de 1 mes

# GENETIC ALGORITHM
# SPRINT 12.6: Increased diversity parameters to prevent premature convergence
ga:
  population: 50       # Was 50 - doubled for more genetic diversity
  generations_max: 30       # Keep as is
  patience_no_improve: 8   # SPRINT 14 FIX: Increased from 5 to 10 (fitness improves slowly)
  elitism: 8                # AUDIT: Increased from 5 to preserve more top patterns (especially SHORT)
  mutation_rate: 0.35       # Was 0.2 - more exploration
  crossover_rate: 0.8       # Was 0.7 - more recombination
  window_min: 3         # SPRINT 12: These are overridden by dynamic window sizing
  window_max: 10        # SPRINT 12: Window size now scales with pattern complexity
  allow_indicators: true
  seed: 23  # CRÍTICO: Reproducibilidad

  # SPRINT 8: Building Blocks Configuration
  building_blocks:
    allow_indicators: true      # Enable RSI, MACD, etc.
    min_modules_per_pattern: 1
    max_modules_per_pattern: 5

  # Progressive Grammar (SPRINT 12.6: Unlock earlier to enable richer patterns)
  progressive_grammar:
    enable: true
    unlock_indicators_gen: 0  # Was 10 - earlier access to MACD, RSI, etc.
    unlock_advanced_gen: 0    # Was 20 - earlier access to Bollinger, Stoch, etc.

  # SPRINT 12: Seed Patterns (30% of initial population)
  # - 15 proven LONG patterns (mean-reversion, trend-following, breakout)
  # - 15 proven SHORT patterns (mean-reversion focused for 15min timeframe)
  # - Gives GA a head start, especially critical for SHORT patterns

  # SPRINT 12: Diversity Maintenance (automatic, no config needed)
  # - Removes duplicate patterns (same module set) every generation
  # - Keeps best fitness when duplicates found
  # - Refills population with random patterns if needed

  fitness:
    # SPRINT 12: New fitness function (Sortino + Calmar + Win Rate)
    # Formula: 0.4*Sortino + 0.4*Calmar + 0.2*WinRate
    # Old weights (UPI/Sharpe/CAGR) are DEPRECATED and no longer used
    weight_upi: 0.5           # DEPRECATED (kept for backward compatibility)
    weight_sharpe: 0.3        # DEPRECATED
    weight_cagr: 0.2          # DEPRECATED
    cagr_min_threshold: 0.0   # Still used as hard constraint
    sharpe_cap: 3.0           # DEPRECATED (Sortino cap is 3.0, hardcoded)
    cagr_cap: 1.0             # DEPRECATED (Calmar cap is 2.0, hardcoded)

  fast_mode:
    enabled: true
    n_windows: 10              # SPRINT 13: Increased from 5 to 10 (better coverage)
    window_months: 1           # SPRINT 10: Duration of each window (months)

  # NUEVO: Evolution tracking
  evolution_tracking:
    enabled: true
    sample_size_per_generation: 5   # Guardar 5 patrones random/gen
    save_every_n_generations: 1   # Snapshot cada 10 gens
    output_dir: "./evolution_snapshots"

# EXIT RULES (Cripto 24/7, no gaps)
exits:
  use_time_exit: false
  bars_hold: 96        # 96 bars de 15m = 24 horas

  use_atr_exits: true
  atr_period: 14
  # SPRINT 12: These are DEFAULT values only (fallback for legacy patterns)
  # New PatternChromosome has individual tp_atr_mult and sl_atr_mult parameters
  # that override these defaults (range: TP 1.5-4.0, SL 0.8-2.0)
  atr_stop: 1.0        # Default: 1.0 ATR stop loss
  atr_take: 2.0        # Default: 2.0 ATR take profit (R:R = 2:1)

# SELECTION & FILTERING
selection:
  topk: 10
  corr_threshold: 0.35

  filters:
    upi_min: 0.05           # SPRINT 9: Relaxed for debugging
    sharpe_min: 0.3         # SPRINT 14 FIX: Lowered from 0.4 (more permissive)
    cagr_min: 0.04          # SPRINT 14 FIX: Lowered from 0.05 (4% minimum)
    max_drawdown_max: 0.60  # SPRINT 14 FIX: Increased from 0.50 (more permissive)
    profit_factor_min: 1.1  # SPRINT 14 FIX: Lowered from 1.15 (just above breakeven)
    win_rate_min: 0.30      # Keep at 0.30 (already permissive)
    min_trades_per_window: 3  # SPRINT 13: Increased from 1 (need reasonable sample)
    max_trades_total: 2500  # SPRINT 14 FIX: NEW - maximum 1000 trades in full data

# ROBUSTNESS TESTS
robustness:
  seed: 23
  bootstrap:
    n_iterations: 1000
    block_size: 20        # Bloques más grandes (autocorrelación en cripto)
    confidence_level: 0.95
  hansen_spa:
    enabled: false
    alpha: 0.05
  white_rc:
    enabled: false
    alpha: 0.05

# OUTPUT
output:
  reports_dir: "./output_reports"
  logs_dir: "./logs"
  evolution_dir: "./evolution_snapshots"
  save_equity_curves: true
  save_correlation_matrix: true
  save_pattern_details: true
  verbose_logging: true
